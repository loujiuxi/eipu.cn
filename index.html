<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亿铺 - 即将启幕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F4E4BA;
            --gold-dark: #A67C00;
            --bg-deep: #0A0A0F;
            --bg-card: #151520;
            --text-primary: #FFFFFF;
            --text-secondary: #9A9AB0;
            --accent-copper: #B87333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 动态背景 */
        .background-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
            top: -200px;
            right: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--accent-copper) 0%, transparent 70%);
            bottom: -100px;
            left: -100px;
            animation-delay: -7s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--gold-dark) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(50px, -30px) scale(1.1); }
            50% { transform: translate(-30px, 50px) scale(0.9); }
            75% { transform: translate(-50px, -20px) scale(1.05); }
        }

        /* 几何装饰 */
        .geometric-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.08;
        }

        .geo-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            height: 1px;
            animation: shimmer 3s ease-in-out infinite;
        }

        .geo-line:nth-child(1) { top: 20%; width: 40%; left: 10%; animation-delay: 0s; }
        .geo-line:nth-child(2) { top: 40%; width: 30%; right: 15%; animation-delay: 0.5s; }
        .geo-line:nth-child(3) { top: 60%; width: 50%; left: 5%; animation-delay: 1s; }
        .geo-line:nth-child(4) { top: 80%; width: 35%; right: 10%; animation-delay: 1.5s; }

        @keyframes shimmer {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        /* 粒子效果 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0;
            animation: rise 8s ease-in infinite;
        }

        @keyframes rise {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1);
            }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Logo区域 */
        .logo-section {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 1s ease-out;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            position: relative;
        }

        .logo-diamond {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
            transform: rotate(45deg);
            animation: pulse 3s ease-in-out infinite;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.5);
        }

        @keyframes pulse {
            0%, 100% { transform: rotate(45deg) scale(1); }
            50% { transform: rotate(45deg) scale(1.05); }
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: clamp(48px, 10vw, 80px);
            font-weight: 700;
            letter-spacing: 0.15em;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--accent-copper) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }

        .logo-tagline {
            font-size: 14px;
            letter-spacing: 0.4em;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* 主标题 */
        .main-content {
            text-align: center;
            max-width: 700px;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        .headline {
            font-family: 'Playfair Display', serif;
            font-size: clamp(32px, 6vw, 48px);
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 25px;
            color: var(--text-primary);
        }

        .headline span {
            color: var(--gold);
        }

        .description {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 50px;
            font-weight: 300;
        }

        /* 进度条 */
        .progress-section {
            width: 100%;
            max-width: 500px;
            margin-bottom: 50px;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 0.1em;
        }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-light));
            border-radius: 10px;
            width: 0%;
            animation: progress 2s ease-out 1s forwards;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: progressShine 2s ease-in-out infinite;
        }

        @keyframes progress {
            to { width: 73%; }
        }

        @keyframes progressShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* 订阅表单 */
        .subscribe-section {
            width: 100%;
            max-width: 500px;
            animation: fadeInUp 1s ease-out 0.9s both;
        }

        .subscribe-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .email-input {
            flex: 1;
            min-width: 250px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 50px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        .email-input::placeholder {
            color: var(--text-secondary);
        }

        .email-input:focus {
            border-color: var(--gold);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .subscribe-btn {
            padding: 16px 40px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            border: none;
            border-radius: 50px;
            color: var(--bg-deep);
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.1em;
        }

        .subscribe-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
        }

        .subscribe-btn:active {
            transform: translateY(0);
        }

        /* 社交链接 */
        .social-links {
            display: flex;
            gap: 20px;
            margin-top: 60px;
            animation: fadeInUp 1s ease-out 1.2s both;
        }

        .social-link {
            width: 44px;
            height: 44px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            background: var(--gold);
            color: var(--bg-deep);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }

        .social-link svg {
            width: 18px;
            height: 18px;
        }

        /* 底部信息 */
        .footer {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 0.1em;
            opacity: 0.6;
        }

        /* 动画关键帧 */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .subscribe-form {
                flex-direction: column;
            }

            .email-input {
                min-width: 100%;
            }

            .subscribe-btn {
                width: 100%;
            }

            .logo-text {
                letter-spacing: 0.1em;
            }
        }

        /* 装饰性角标 */
        .corner-decoration {
            position: fixed;
            width: 150px;
            height: 150px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            z-index: 1;
            pointer-events: none;
        }

        .corner-decoration.top-left {
            top: 30px;
            left: 30px;
            border-right: none;
            border-bottom: none;
        }

        .corner-decoration.top-right {
            top: 30px;
            right: 30px;
            border-left: none;
            border-bottom: none;
        }

        .corner-decoration.bottom-left {
            bottom: 30px;
            left: 30px;
            border-right: none;
            border-top: none;
        }

        .corner-decoration.bottom-right {
            bottom: 30px;
            right: 30px;
            border-left: none;
            border-top: none;
        }
    </style>
</head>

    <script>
        // 创建粒子效果
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 30;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = (6 + Math.random() * 4) + 's';
                container.appendChild(particle);
            }
        }

        // 表单提交处理
        function handleSubmit(event) {
            event.preventDefault();
            const email = event.target.querySelector('input').value;
            
            // 显示成功提示
            const btn = event.target.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = '订阅成功 ✓';
            btn.style.background = 'linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%)';
            
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = '';
                event.target.reset();
            }, 2000);
        }

        // 初始化
        createParticles();
    </script>
